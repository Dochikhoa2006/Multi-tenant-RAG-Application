[project]
name = "rag-local-evaluation"
version = "0.1.0"
description = "Local-only Ragas evaluation for immutable RAG evidence records"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==0.3.27",
    "langchain-community==0.3.31",
    "langchain-core==0.3.80",
    "langchain-openai==0.3.35",
    "openai==2.54.0",
    "ragas==0.4.3",
    "sentence-transformers==5.1.2",
]

[project.scripts]
rag-evaluate = "rag_evaluation.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

