global
    log stdout format raw local0
    user haproxy
    group haproxy
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    # The runtime owns a long-lived pinned Weaviate gRPC channel. A one-minute
    # idle timeout closes that healthy HTTP/2 transport before the first
    # background wizard or chat operation can reuse it.
    timeout client 1h
    timeout server 1h

frontend weaviate_grpc_tls
    bind :5443 ssl crt /run/tailscale-certs/weaviate.pem alpn h2
    default_backend weaviate_grpc

backend weaviate_grpc
    server weaviate weaviate:50051 check
