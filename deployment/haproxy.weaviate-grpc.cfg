global
    log stdout format raw local0
    user haproxy
    group haproxy
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend weaviate_grpc_tls
    bind :5443 ssl crt /run/tailscale-certs/weaviate.pem alpn h2
    default_backend weaviate_grpc

backend weaviate_grpc
    server weaviate weaviate:50051 check
